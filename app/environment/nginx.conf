server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;   # keep the port in redirects (localhost:3004)

    location = / {
        return 301 /pet-store/app/index.html;
    }

    # SPA fallback: client-side routes resolve to index.html
    location /pet-store/app/ {
        try_files $uri /pet-store/app/index.html;
    }

    # Deny secrets / build artifacts
    location ~ /\.env { return 404; }
    location ~ /\.git { return 404; }
    location ~ /node_modules { return 404; }
    location ~ /package-lock\.json { return 404; }
    location ~ /\.dockerignore { return 404; }
}
